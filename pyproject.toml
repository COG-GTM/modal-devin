[project]
name = "modal-devin"
version = "0.1.0"
description = "Run Devin Outposts workers on Modal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.0",
    "cyclopts>=3",
    "rich>=13.6",
]

[project.scripts]
modal-devin = "modal_devin.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modal_devin"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "modal-devin-test",
]
