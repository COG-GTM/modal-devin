[project]
name = "modal-devin"
version = "0.1.0"
description = "Run Devin Outposts workers on Modal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "modal-devin contributors" },
]
keywords = ["devin", "modal", "outposts", "workers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "modal>=1.5.1",
    "cyclopts>=4.20",
    "pydantic-settings>=2.0",
    "rich>=13.6",
]

[project.urls]
Repository = "https://github.com/aaazzam/modal-devin"
Issues = "https://github.com/aaazzam/modal-devin/issues"
Changelog = "https://github.com/aaazzam/modal-devin/blob/main/CHANGELOG.md"

[project.scripts]
modal-devin = "modal_devin.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modal_devin"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
