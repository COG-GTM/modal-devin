name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest -q

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run coverage run -m pytest -q
      - run: uv run coverage report
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check --error all .
      - run: uv build
      - name: Smoke-test the built wheel
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          uv run --isolated --with "$GITHUB_WORKSPACE"/dist/*.whl \
            python -c "from modal_devin import Worker; assert Worker('smoke', pool_id='pool').name == 'smoke'"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npx -y mint broken-links
